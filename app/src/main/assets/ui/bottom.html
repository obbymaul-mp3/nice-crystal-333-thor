<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nice Crystal 333 controls</title><link rel="stylesheet" href="ui.css">
<style>
html { font-size: calc(100vw / 62); }
body { background: radial-gradient(ellipse at 24% 30%, #161A52 0%, #07071A 50%, #020206 100%); display: flex; gap: 1.4rem; padding: 1.6rem; }
#left { width: 27.6rem; display: flex; flex-direction: column; gap: 1.2rem; } #right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1rem; }
#xy { position: relative; width: 27.6rem; height: 27.6rem; flex-shrink: 0; border-radius: 50%; background: radial-gradient(circle at 62% 40%, #2A318F 0%, #0B0B2A 55%, #030308 100%); box-shadow: inset 0 0 0 1px #5F6BC8; overflow: hidden; }
#puck { position: absolute; width: 5.6rem; height: 5.6rem; margin: -2.8rem; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #B9C4FF 35%, #3D5BFF 100%); box-shadow: 0 0 3.4rem #7C8CFF; pointer-events: none; }
#xy span span { position: static; width: auto; }
#xy > span { position: absolute; left: 0; width: 100%; text-align: center; font-size: 1.1rem; pointer-events: none; }
#keys { flex: 1; display: flex; gap: .6rem; min-height: 0; } #keys button { flex: 1; border-radius: 4rem; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 1.4rem; font-size: 1.4rem; background: rgba(10,10,30,.8); box-shadow: inset 0 0 0 1px #5F6BC8; }
#keys button.root { background: linear-gradient(180deg, #fff, #B9C4FF); color: #05050A; box-shadow: 0 0 2rem rgba(185,196,255,.8); } #keys button.fifth { background: rgba(61,91,255,.35); box-shadow: inset 0 0 0 1px #7C8CFF; color: #fff; } #keys button.down { filter: brightness(1.6); transform: translateY(.2rem); }
#src { display: flex; gap: .6rem; height: 4.6rem; } #src button { font-size: 1.1rem; } #src .w { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 1.2rem; } #src .n { width: 3.9rem; font-size: 1.5rem; } #src .m { flex: 1; padding: 0; } #rec.on { background: rgba(255,90,122,.45); box-shadow: inset 0 0 0 1px #FF8AA0, 0 0 2rem rgba(255,90,122,.8); color: #fff; }
#pads { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; } #pads button { height: 6.6rem; border-radius: 3.3rem; text-align: left; padding: 0 2.4rem; color: #fff; } #pads b { display: block; font-family: Michroma; font-weight: 400; font-size: 1.4rem; } #pads small { display: block; font-size: 1.2rem; font-weight: 700; margin-top: .2rem; }
#pads .a { background: rgba(10,10,30,.8); box-shadow: inset 0 0 0 1px #fff; } #pads .a.on { background: linear-gradient(180deg, #fff, #B9C4FF); color: #05050A; box-shadow: 0 0 2.6rem rgba(185,196,255,.8); }
#pads .b { background: rgba(61,91,255,.14); box-shadow: inset 0 0 0 1px #7C8CFF; } #pads .b.on { background: rgba(61,91,255,.6); box-shadow: inset 0 0 0 1px #B9C4FF, 0 0 2.6rem rgba(61,91,255,.9); }
#pads .x { background: rgba(138,107,255,.14); box-shadow: inset 0 0 0 1px #A892FF; } #pads .x.on { background: rgba(138,107,255,.6); box-shadow: inset 0 0 0 1px #D0C4FF, 0 0 2.6rem rgba(138,107,255,.9); }
#pads .y { background: rgba(10,10,30,.8); box-shadow: inset 0 0 0 1px #E8EAF6; } #pads button.down { filter: brightness(1.5); }
#pg { display: flex; gap: .5rem; height: 3.4rem; } #pg button { flex: 1; font-size: 1rem; }
#sl { flex: 1; display: flex; flex-direction: column; justify-content: space-around; padding: 0 .8rem; min-height: 0; }
.s { padding: .2rem 0; } .s .h { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.1rem; } .s .h b { font-weight: 400; font-size: 1.3rem; color: #fff; } .s.sel .h span { color: #fff; text-shadow: 0 0 1rem #9FB0FF; }
.s .t { position: relative; height: .4rem; margin: 1rem 0 .8rem; border-radius: .2rem; background: #2A2F66; } .s .t i { position: absolute; left: 0; top: 0; height: 100%; border-radius: .2rem; background: linear-gradient(90deg, #3D5BFF, #fff); box-shadow: 0 0 1rem #7C8CFF; } .s .t u { position: absolute; top: -.9rem; width: 2.2rem; height: 2.2rem; margin-left: -1.1rem; border-radius: 50%; background: radial-gradient(circle, #fff, #7C8CFF); box-shadow: 0 0 1.6rem #7C8CFF; }
#th { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; } #th button { height: 5rem; font-size: 1.1rem; } #th button.on { background: rgba(61,91,255,.5); box-shadow: inset 0 0 0 1px #B9C4FF, 0 0 2rem rgba(61,91,255,.9); color: #fff; }
</style></head>
<body>
<div id="left">
  <div id="xy"><span class="f dim" style="top: 2.4rem" id="xs">SIZE</span><div id="puck"></div><span class="f dim" style="bottom: 2.4rem" id="xp">POSITION</span></div>
  <div id="keys" class="f"></div>
</div>
<div id="right">
  <div id="src" class="f"><button class="cap n" data-step="-1" aria-label="Previous sound">‹</button><button class="cap n" data-step="1" aria-label="Next sound">›</button><button class="cap n" id="add" aria-label="Add a file">+</button><button class="cap m" id="live">LIVE</button><button class="cap m" id="rec">REC</button><button class="cap m" id="grab">GRAB</button></div>
  <div id="pads">
    <button class="a" data-pad="PLAY"><b>PLAY</b><small>プレイ · A</small></button><button class="b" data-pad="FREEZE"><b>FREEZE</b><small>フリーズ · B</small></button>
    <button class="x" data-pad="REVERSE"><b>REVERSE</b><small>リバース · X</small></button><button class="y" data-pad="CHAOS"><b>CHAOS</b><small>カオス · Y</small></button>
  </div>
  <div id="pg" class="f"></div>
  <div id="sl" class="f"></div>
  <div id="th" class="f"><button class="cap" data-throw="FILTER">FILTER</button><button class="cap" data-throw="SPACE">SPACE</button><button class="cap" data-throw="STUTTER">STUT</button><button class="cap" data-throw="HALF">HALF</button></div>
</div>
<script src="ui.js"></script>
<script>
let st = getState() || { p: [], sel: 0 }; const dragging = {};
// ---- sliders: five pages of four. The order matches the app, so the D-pad walks through the same list.
const snapSemi = v => 0.5 + Math.round((v - 0.5) * 48) / 48;
const PAGES = [
  ["MAIN", [["PITCH", P.PITCH, fmt.pitch, snapSemi], ["DENSITY", P.DENSITY, fmt.density], ["TONE", P.TONE, fmt.tone], ["SPACE", P.SPACE, fmt.pct]]],
  ["SLICE", [["LENGTH", P.LENGTH, v => fmt.len(v, st.seconds || 1)], ["SCAN", P.SCAN, fmt.scan], ["SPRAY", P.SPRAY, fmt.pct], ["SHATTER", P.SHATTER, fmt.off]]],
  ["SHAPE", [["SPREAD", P.SPREAD, fmt.pct], ["ATTACK", P.ATTACK, fmt.pct], ["SUSTAIN", P.SUSTAIN, fmt.off], ["BLEND", P.MIX, fmt.blend]]],
  ["DIRT", [["RESONANCE", P.RESO, fmt.pct], ["DRIVE", P.DRIVE, fmt.off], ["CRUSH", P.CRUSH, fmt.off], ["CHORUS", P.CHORUS, fmt.off]]],
  ["ECHO", [["ECHO", P.DELAY, fmt.off], ["TIME", P.DTIME, fmt.time], ["FEEDBACK", P.DFEED, fmt.pct], ["DECAY", P.DECAY, fmt.decay]]],
];
let page = 0, SL = PAGES[0][1];
PAGES.forEach(([name], k) => { const b = document.createElement("button"); b.className = "cap"; b.textContent = name; b.addEventListener("pointerdown", () => { NC.select(k * 4); st.sel = k * 4; paint(); }); $("pg").appendChild(b); });
for (let k = 0; k < 4; k++) {
  const el = document.createElement("div"); el.className = "s"; el.innerHTML = `<div class="h"><span class="dim"></span><b></b></div><div class="t"><i></i><u></u></div>`; $("sl").appendChild(el);
  const move = e => { const [, idx, , snap] = SL[k], r = el.querySelector(".t").getBoundingClientRect(); let v = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); if (snap) v = snap(v); st.p[idx] = v; NC.set(idx, v); paint(); };
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); dragging["s" + k] = true; NC.select(page * 4 + k); st.sel = page * 4 + k; move(e); });
  el.addEventListener("pointermove", e => { if (dragging["s" + k]) move(e); });
  for (const ev of ["pointerup", "pointercancel"]) el.addEventListener(ev, () => { dragging["s" + k] = false; });
}
// ---- the round pad: left-right is POSITION, up is SIZE
const xy = $("xy"), xyMove = e => { const r = xy.getBoundingClientRect(), x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)); st.p[P.POSITION] = x; st.p[P.SIZE] = y; NC.set(P.POSITION, x); NC.set(P.SIZE, y); paint(); };
xy.addEventListener("pointerdown", e => { xy.setPointerCapture(e.pointerId); dragging.xy = true; xyMove(e); }); xy.addEventListener("pointermove", e => { if (dragging.xy) xyMove(e); });
for (const ev of ["pointerup", "pointercancel"]) xy.addEventListener(ev, () => { dragging.xy = false; });
// ---- pads and throws fire the moment they are touched
for (const b of document.querySelectorAll("[data-pad]")) { b.addEventListener("pointerdown", () => { b.classList.add("down"); NC.pad(b.dataset.pad, true); setTimeout(poll, 30); }); for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => b.classList.remove("down")); }
for (const b of document.querySelectorAll("[data-throw]")) { const off = () => { if (b._on) { b._on = false; NC.pad(b.dataset.throw, false); b.classList.remove("on"); } }; b.addEventListener("pointerdown", e => { b.setPointerCapture(e.pointerId); b._on = true; b.classList.add("on"); NC.pad(b.dataset.throw, true); }); for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, off); }
// ---- keys: one octave of the scale of the key you are hearing. The first key is the sound at its current pitch.
const keyBtns = [0, 1, 2, 3, 4, 5, 6, 7].map(k => {
  const b = document.createElement("button"); if (k === 0 || k === 7) b.className = "root"; else if (k === 4) b.className = "fifth"; $("keys").appendChild(b); b._n = 60;
  const off = () => { if (b._on) { b._on = false; b.classList.remove("down"); NC.note(b._held, false); } };
  b.addEventListener("pointerdown", e => { b.setPointerCapture(e.pointerId); b._on = true; b._held = b._n; b.classList.add("down"); NC.note(b._n, true); }); for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, off);
  return b;
});
for (const b of document.querySelectorAll("[data-step]")) b.addEventListener("pointerdown", () => { NC.sound(+b.dataset.step); setTimeout(poll, 150); });
$("live").addEventListener("pointerdown", () => { NC.live(!st.live); setTimeout(poll, 60); }); $("grab").addEventListener("pointerdown", () => { NC.grab(); setTimeout(poll, 400); }); $("rec").addEventListener("pointerdown", () => { NC.rec(); setTimeout(poll, 80); });
// + adds a file from storage; holding it for a second removes the loaded sound if it is one of yours
{ const b = $("add"); let t = 0, held = false; b.addEventListener("pointerdown", () => { held = false; t = setTimeout(() => { held = true; NC.remove(); setTimeout(poll, 200); }, 900); }); b.addEventListener("pointerup", () => { clearTimeout(t); if (!held) NC.add(); }); b.addEventListener("pointercancel", () => clearTimeout(t)); }
function paint() {
  const p = st.p; if (!p.length) return;
  $("puck").style.left = (8 + 84 * p[P.POSITION]) + "%"; $("puck").style.top = (92 - 84 * p[P.SIZE]) + "%"; $("xp").innerHTML = "POSITION " + Math.round(p[P.POSITION] * 100) + '<span style="font-family:sans-serif">%</span>'; $("xs").textContent = "SIZE " + fmt.size(p[P.SIZE]);
  document.querySelector('[data-pad="PLAY"]').classList.toggle("on", p[P.PLAY] > 0.5); document.querySelector('[data-pad="FREEZE"]').classList.toggle("on", p[P.FREEZE] > 0.5); document.querySelector('[data-pad="REVERSE"]').classList.toggle("on", p[P.REV] > 0.5);
  page = Math.max(0, Math.min(4, Math.floor((st.sel || 0) / 4))); SL = PAGES[page][1]; [...$("pg").children].forEach((b, k) => b.classList.toggle("on", k === page));
  const hk = heardKey(st), steps = hk && !hk.minor ? [0, 2, 4, 5, 7, 9, 11, 12] : [0, 2, 3, 5, 7, 8, 10, 12];
  keyBtns.forEach((b, k) => { b._n = 60 + steps[k]; b.textContent = hk ? NOTES[(hk.root + steps[k]) % 12] : String(k + 1); });
  [...$("sl").children].forEach((el, k) => { const [name, idx, f] = SL[k], v = p[idx]; el.querySelector("span").textContent = name; el.classList.toggle("sel", st.sel === page * 4 + k); el.querySelector("b").innerHTML = f(v).replace("%", '<span style="font-family:sans-serif">%</span>'); el.querySelector("i").style.width = v * 100 + "%"; el.querySelector("u").style.left = v * 100 + "%"; });
  $("live").classList.toggle("on", !!st.live); $("rec").classList.toggle("on", !!st.rec); $("grab").style.opacity = st.live ? 1 : 0.4;
  const held = (st.throws || "").split(","); for (const b of document.querySelectorAll("[data-throw]")) if (!b._on) b.classList.toggle("on", held.includes(b.dataset.throw));
}
function poll() { const s = getState(); if (!s) return; if (dragging.xy) { s.p[P.POSITION] = st.p[P.POSITION]; s.p[P.SIZE] = st.p[P.SIZE]; } SL.forEach(([, idx], k) => { if (dragging["s" + k]) { s.p[idx] = st.p[idx]; s.sel = st.sel; } }); st = s; paint(); }
poll(); setInterval(poll, 66);
</script>
</body></html>
