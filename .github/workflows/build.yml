name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NiceCrystal333-Thor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NiceCrystal333-Thor
          path: NiceCrystal333-Thor.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nice Crystal 333 for the Thor (latest build)
          body: "Build ${{ github.run_number }}. Download NiceCrystal333-Thor.apk on the Thor and open it to install."
          files: NiceCrystal333-Thor.apk
